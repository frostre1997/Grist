name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Python and gcc
        run: sudo apt-get update && sudo apt-get install -y python3 gcc

      - name: Compile minimal.gr
        run: python3 bootstrap/bootstrap.py minimal.gr

      - name: Run daemon in background
        run: |
          ./minimal.gr.out &
          sleep 2

      - name: Check daemon is running
        run: pgrep -f minimal.gr.out || exit 1

      - name: Stop daemon
        run: pkill -f minimal.gr.out || true

      - name: Upload daemon
        uses: actions/upload-artifact@v7
        with:
          name: minimal-daemon-linux
          path: minimal.gr.out
