name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Zig 0.14.0
        run: |
          curl -L https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$(pwd)/zig-linux-x86_64-0.14.0" >> $GITHUB_PATH

      - name: Verify Zig
        run: zig version

      - name: Install C compiler
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Build gristc
        run: zig build

      - name: Compile minimal.gr
        run: ./zig-out/bin/gristc minimal.gr

      - name: Run daemon
        run: |
          ./minimal.gr.out &
          sleep 2

      - name: Check daemon
        run: pgrep -f minimal.gr.out || exit 1

      - name: Stop daemon
        run: pkill -f minimal.gr.out || true

      - name: Upload gristc
        uses: actions/upload-artifact@v7
        with:
          name: gristc-linux
          path: zig-out/bin/gristc

      - name: Upload daemon
        uses: actions/upload-artifact@v7
        with:
          name: minimal-daemon-linux
          path: minimal.gr.out
